name: Build Android APK

# CI/CD se nespousti automaticky (push/PR) - jen manualne pres workflow_dispatch,
# kdyz je to opravdu potreba ("krajni mez"). Zadne auto-spusteni po commitech.
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # NativeScript 8.3 vyžaduje JDK 17 – bez explicitní instalace
      # může CI použít výchozí JDK (11/21) a build selže.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check (strict)
        run: npm run typecheck

      - name: Run unit tests
        run: set -o pipefail && npm test -- --ci 2>&1 | tee /tmp/jest-output.log

      - name: Report unit test failures as GitHub issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI: unit testy selhaly (commit ${{ github.sha }})"
            echo ""
            tail -n 500 /tmp/jest-output.log
          } > /tmp/issue-body.md
          gh issue create -R "${{ github.repository }}" \
            --title "CI: unit testy selhaly (commit ${{ github.sha }})" \
            --body-file /tmp/issue-body.md || true

      - name: Coverage check (thresholds)
        run: npm test -- --coverage --ci

      - name: Setup NativeScript
        run: |
          npm install -g nativescript@8.3.0
          ns --version

      # POZOR: android-actions/setup-android@v3 nemá žádné versionované inputy
      # (android-version, ndk-version, cmake-version, build-tools-version,
      # accept-licenses se tiše ignorují). SDK komponenty se instalují
      # explicitně přes sdkmanager v dalším kroku.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "extras;android;m2repository"
          sdkmanager "extras;google;m2repository"

      # Debug build – bez --env.production (to patří až na release build;
      # kombinace „Debug" + production env byla nekonzistentní).
      - name: Build Android APK (Debug)
        run: ns build android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CZE-asistent-Android-APK
          path: |
            **/app/build/outputs/apk/**/*.apk
            **/platforms/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

      - name: List built files
        run: find . -name "*.apk" -type f 2>/dev/null | head -20

