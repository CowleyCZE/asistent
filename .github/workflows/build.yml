name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check (strict)
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm test -- --coverage 2>&1 | tee /tmp/test.log; exit ${PIPESTATUS[0]}

      - name: Publish test output to job summary
        if: failure()
        run: tail -n 800 /tmp/test.log >> $GITHUB_STEP_SUMMARY || true

      - name: Emit failing tests as annotations
        if: failure()
        run: |
          grep -E '✕|✗|●|FAIL ' /tmp/test.log | head -60 | while IFS= read -r line; do
            line=${line#}
            echo "::error::${line:0:200}"
          done
          true

      - name: Report test failures as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 800 /tmp/test.log > /tmp/body.md || echo 'test log nenalezen' > /tmp/body.md
          gh issue create --repo CowleyCZE/asistent \
            --title "CI: unit testy selhaly (commit ${{ github.sha }})" \
            --body-file /tmp/body.md || true

      - name: Setup NativeScript
        run: |
          npm install -g nativescript@8.3.0
          ns --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 33
          ndk-version: 25.2.9519653
          cmake-version: 3.22.1
          build-tools-version: 33.0.2
          accept-licenses: true

      - name: Install Android dependencies
        run: |
          sdkmanager "platforms;android-33"
    
      sdkmanager "build-tools;33.0.2"
          sdkmanager "extras;android;m2repository"
          sdkmanager "extras;google;m2repository"

      - name: Build Android APK (Debug)
        run: ns build android --env.production
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CZE-asistent-Android-APK
          path: |
            **/app/build/outputs/apk/**/*.apk
            **/platforms/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

      - name: List built files
        run: find . -name "*.apk" -type f 2>/dev/null | head -20
